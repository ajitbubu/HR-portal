services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: datasafeguard_hr
      POSTGRES_USER: hruser
      POSTGRES_PASSWORD: hrpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hruser -d datasafeguard_hr"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # Web UI — open http://localhost:8025 to view captured emails
      - "1025:1025"   # SMTP
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://hruser:hrpass@db:5432/datasafeguard_hr
      SECRET_KEY: datasafeguard-hr-production-secret-key
      CORS_ORIGINS: '["http://localhost:3000"]'
      # Mailpit SMTP — set MAIL_ENABLED=true to capture emails locally
      MAIL_ENABLED: "false"
      MAIL_SERVER: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM: hr@datasafeguard.ai
      MAIL_STARTTLS: "false"
      MAIL_SSL_TLS: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
