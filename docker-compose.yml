services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: datasafeguard_hr
      POSTGRES_USER: hruser
      POSTGRES_PASSWORD: hrpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hruser -d datasafeguard_hr"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # Web UI — open http://localhost:8025 to view captured emails
      - "1025:1025"   # SMTP
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://hruser:hrpass@db:5432/datasafeguard_hr
      SECRET_KEY: datasafeguard-hr-production-secret-key
      CORS_ORIGINS: '["http://localhost:3000"]'
      # Microsoft 365 SMTP — set MAIL_ENABLED=true and fill credentials for real email.
      # For local testing keep MAIL_ENABLED=false and use the mailpit service (localhost:8025).
      MAIL_ENABLED: "false"
      MAIL_SERVER: smtp.office365.com
      MAIL_PORT: "587"
      MAIL_USERNAME: "hr@datasafeguard.ai"
      MAIL_PASSWORD: ""          # set your Microsoft 365 password / app password here
      MAIL_FROM: hr@datasafeguard.ai
      MAIL_STARTTLS: "true"
      MAIL_SSL_TLS: "false"
      # Microsoft 365 SSO — fill in to enable the "Sign in with Microsoft" button
      AZURE_CLIENT_ID: ""
      AZURE_CLIENT_SECRET: ""
      AZURE_TENANT_ID: ""
      AZURE_REDIRECT_URI: "http://localhost:8000/api/auth/microsoft/callback"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
